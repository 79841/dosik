# Builds the Windows installer (NSIS) on request, for testing on a Windows machine:
#   gh workflow run windows-build.yml --ref <branch>
name: Windows Build

on:
  workflow_dispatch:

# checks out and uploads an artifact, so read access is enough
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri Windows bundle (x64)
    if: github.repository == '79841/dosik'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dosik-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
