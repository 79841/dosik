[package]
name = "dosik"
version = "0.2.0"
description = "Dosik — a diagram app AI agents can edit"
authors = ["Dosik"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dosik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-clipboard-manager = "2.3.3"
keyring = "4.2.0"
# Settings ▸ Integrations edits ~/.codex/config.toml without disturbing the rest (#252)
toml_edit = "0.25"
# Delete in the library moves things to the system Trash, never removes them
# outright; no dates of trashed items are read, so `jiff` stays out
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "coinit_apartmentthreaded"] }
# The library's folders are watched, so what Finder or an agent changes in
# them shows while the app is open; events come in batches, 300 ms apart
notify = "8.2"
notify-debouncer-mini = "0.7"

